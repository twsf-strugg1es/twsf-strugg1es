name: Update profile card

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from the start of the hour to reduce queue delays.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - dark_mode.svg
      - light_mode.svg

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate live profile cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: twsf-strugg1es
        run: node scripts/generate-profile.mjs

      - name: Commit refreshed cards when data changed
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "Profile data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "chore: refresh profile statistics"
          git push
